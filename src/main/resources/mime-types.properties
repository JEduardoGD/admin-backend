# MIME Type -> file extension(s)
# Multiple extensions for the same MIME type are comma-separated.

# AAC audio
audio/aac=.aac

# AbiWord document
application/x-abiword=.abw

# Animated Portable Network Graphics (APNG) image
image/apng=.apng

# Archive document (multiple files embedded)
application/x-freearc=.arc

# AVIF image
image/avif=.avif

# AVI: Audio Video Interleave
video/x-msvideo=.avi

# Amazon Kindle eBook format
application/vnd.amazon.ebook=.azw

# Any kind of binary data
application/octet-stream=.bin

# Windows OS/2 Bitmap Graphics
image/bmp=.bmp

# BZip archive
application/x-bzip=.bz

# BZip2 archive
application/x-bzip2=.bz2

# CD audio
application/x-cdf=.cda

# C-Shell script
application/x-csh=.csh

# Cascading Style Sheets (CSS)
text/css=.css

# Comma-separated values (CSV)
text/csv=.csv

# Microsoft Word
application/msword=.doc

# Microsoft Word (OpenXML)
application/vnd.openxmlformats-officedocument.wordprocessingml.document=.docx

# MS Embedded OpenType fonts
application/vnd.ms-fontobject=.eot

# Electronic publication (EPUB)
application/epub+zip=.epub

# GZip Compressed Archive
application/gzip=.gz

# Graphics Interchange Format (GIF)
image/gif=.gif

# HyperText Markup Language (HTML)
text/html=.html

# Icon format
image/vnd.microsoft.icon=.ico

# iCalendar format
text/calendar=.ics

# Java Archive (JAR)
application/java-archive=.jar

# JPEG images
image/jpeg=.jpg

# JavaScript / JavaScript module (HTML, RFC 9239)
text/javascript=.js

# JSON format
application/json=.json

# JSON-LD format
application/ld+json=.jsonld

# Markdown
text/markdown=.md

# Musical Instrument Digital Interface (MIDI)
audio/midi=.midi
audio/x-midi=.midi

# MP4 audio
audio/mp4=.m4a

# MP3 audio
audio/mpeg=.mp3

# MP4 video
video/mp4=.mp4

# MPEG Video
video/mpeg=.mpeg

# Apple Installer Package
application/vnd.apple.installer+xml=.mpkg

# OpenDocument presentation document
application/vnd.oasis.opendocument.presentation=.odp

# OpenDocument spreadsheet document
application/vnd.oasis.opendocument.spreadsheet=.ods

# OpenDocument text document
application/vnd.oasis.opendocument.text=.odt

# Ogg audio / Opus audio in Ogg container
audio/ogg=.oga

# Ogg video
video/ogg=.ogv

# Ogg
application/ogg=.ogx

# OpenType font
font/otf=.otf

# Portable Network Graphics
image/png=.png

# Adobe Portable Document Format (PDF)
application/pdf=.pdf

# Hypertext Preprocessor (Personal Home Page)
application/x-httpd-php=.php

# Microsoft PowerPoint
application/vnd.ms-powerpoint=.ppt

# Microsoft PowerPoint (OpenXML)
application/vnd.openxmlformats-officedocument.presentationml.presentation=.pptx

# RAR archive
application/vnd.rar=.rar

# Rich Text Format (RTF)
application/rtf=.rtf

# Bourne shell script
application/x-sh=.sh

# Scalable Vector Graphics (SVG)
image/svg+xml=.svg

# Tape Archive (TAR)
application/x-tar=.tar

# Tagged Image File Format (TIFF)
image/tiff=.tiff

# MPEG transport stream
video/mp2t=.ts

# TrueType Font
font/ttf=.ttf

# Text (generally ASCII or ISO 8859-n)
text/plain=.txt

# Microsoft Visio
application/vnd.visio=.vsd

# Waveform Audio Format
audio/wav=.wav

# WEBM audio
audio/webm=.weba

# WEBM video
video/webm=.webm

# Web application manifest
application/manifest+json=.webmanifest

# WEBP image
image/webp=.webp

# Web Open Font Format (WOFF)
font/woff=.woff

# Web Open Font Format (WOFF2)
font/woff2=.woff2

# XHTML
application/xhtml+xml=.xhtml

# Microsoft Excel
application/vnd.ms-excel=.xls

# Microsoft Excel (OpenXML)
application/vnd.openxmlformats-officedocument.spreadsheetml.sheet=.xlsx

# XML (application/xml recommended by RFC 7303; text/xml still used)
application/xml=.xml
text/xml=.xml

# XUL
application/vnd.mozilla.xul+xml=.xul

# ZIP archive
application/zip=.zip

# 3GPP audio/video container (use audio/3gpp when there is no video)
video/3gpp=.3gp
audio/3gpp=.3gp

# 3GPP2 audio/video container (use audio/3gpp2 when there is no video)
video/3gpp2=.3g2
audio/3gpp2=.3g2

# 7-zip archive
application/x-7z-compressed=.7z
